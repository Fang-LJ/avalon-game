upstream playmate_server_backend {
    zone playmate_server_backend 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server playmate-server:8080 resolve;
}

upstream playmate_minio_backend {
    zone playmate_minio_backend 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server playmate-minio:9000 resolve;
}

upstream avalon_server_backend {
    zone avalon_server_backend 64k;
    resolver 127.0.0.11 valid=10s ipv6=off;
    server avalon-server:8081 resolve;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.playmatespace.cloud;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.playmatespace.cloud;

    client_max_body_size 6m;

    ssl_certificate /etc/letsencrypt/live/api.playmatespace.cloud/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.playmatespace.cloud/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /avalon/ws/ {
        proxy_pass http://avalon_server_backend/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location /avalon/ {
        proxy_pass http://avalon_server_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location /api/ {
        proxy_pass http://playmate_server_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location /avalon-assets/ {
        proxy_pass http://playmate_minio_backend/avalon-assets/;
        proxy_http_version 1.1;
        proxy_set_header Host playmate-minio:9000;
        proxy_hide_header Cache-Control;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /minio/ {
        proxy_pass http://playmate_minio_backend/;
        proxy_http_version 1.1;
        proxy_set_header Host playmate-minio:9000;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location / {
        return 404;
    }
}
