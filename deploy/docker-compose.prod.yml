name: avalon-game

services:
  avalon-server:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: avalon-game-server:prod
    container_name: avalon-server
    restart: unless-stopped
    env_file:
      - .env.prod
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8081
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/api/health >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s
    mem_limit: 600m
    pids_limit: 160
    networks:
      - playmate-prod

networks:
  playmate-prod:
    external: true
    name: playmate-prod
